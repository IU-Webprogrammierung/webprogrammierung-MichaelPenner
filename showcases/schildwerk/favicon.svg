<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Glass/Dark Gradient -->
    <linearGradient id="swBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16193b"/>
      <stop offset="50%" stop-color="#0f1128"/>
      <stop offset="100%" stop-color="#070914"/>
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="swBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="swGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceddb"/>
      <stop offset="35%" stop-color="#e0b68a"/>
      <stop offset="70%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#a87541"/>
    </linearGradient>

    <linearGradient id="swGoldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fcecdb"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>

    <!-- Inner Plate Fill -->
    <linearGradient id="swPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22264f"/>
      <stop offset="100%" stop-color="#111329"/>
    </linearGradient>

    <!-- Filter for Soft Glow -->
    <filter id="swGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#swBg)" stroke="url(#swBorder)" stroke-width="1.5"/>

  <!-- Radial Highlight on Background -->
  <circle cx="32" cy="24" r="22" fill="#d4a574" opacity="0.12"/>

  <!-- Shield Base Drop Shadow -->
  <path d="M 32 12 C 45 12 49 14 50 25 C 50 40 40 48.5 32 52.5 C 24 48.5 14 40 14 25 C 15 14 19 12 32 12 Z"
        fill="#04050a" opacity="0.55" transform="translate(0, 2)"/>

  <!-- Shield Outer Bevel (Gold Rim) -->
  <path d="M 32 12 C 45 12 49 14 50 25 C 50 40 40 48.5 32 52.5 C 24 48.5 14 40 14 25 C 15 14 19 12 32 12 Z"
        fill="url(#swGold)"/>

  <!-- Shield Inner Cutout / Plate (Deep Contrast) -->
  <path d="M 32 15.5 C 42.5 15.5 45.5 17 46.5 25.5 C 46.5 38 38 45.5 32 49 C 26 45.5 17.5 38 17.5 25.5 C 18.5 17 21.5 15.5 32 15.5 Z"
        fill="url(#swPlate)"/>

  <!-- 3D Printed Precision Layer Lines Accent inside Shield -->
  <path d="M 22 23 L 42 23" stroke="#d4a574" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round"/>
  <path d="M 20 28 L 44 28" stroke="#d4a574" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round"/>
  <path d="M 21 33 L 43 33" stroke="#d4a574" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round"/>
  <path d="M 23 38 L 41 38" stroke="#d4a574" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round"/>

  <!-- Stylized Geometric "S" Monogram (Precision Sign Contour) -->
  <path d="M 39 21.5 C 33.5 21 24.5 22 24.5 28 C 24.5 33.5 39.5 32.5 39.5 38.5 C 39.5 43.5 31 44.5 24.5 41.5 L 24.5 36.8 C 29.5 39.8 35 39.8 35 37.2 C 35 32.5 20 33 20 27 C 20 20.5 30 17 39 17.5 Z"
        fill="url(#swGoldBright)" filter="url(#swGlow)"/>

  <!-- Subtle 3D Depth Layer for the S -->
  <path d="M 39 22.5 C 33.5 22 25.5 23 25.5 28.5 C 25.5 34 39.5 33.5 39.5 39 C 39.5 42 34 43 28 41.5"
        stroke="#8a5c2d" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- 3D Sign Screw / Fastener Accents in Corners of the shield plate -->
  <circle cx="32" cy="18" r="1.2" fill="#d4a574" opacity="0.8"/>
</svg>