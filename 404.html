<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 - Seite nicht gefunden | Michael Krahn Maker Studio">
  <title>404 - Page Not Found | Michael Krahn</title>

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/404.css">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

  <!-- Custom Cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>

  <div class="error-container">
    <!-- Floating Particles -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Decorative Orbits -->
    <div class="decorative-orbit"></div>
    <div class="decorative-orbit"></div>
    <div class="decorative-orbit"></div>

    <!-- Main Content -->
    <div class="error-content">
      <div class="error-number">
        <span>4</span><span>0</span><span>4</span>
      </div>

      <div class="error-message">
        <h1 data-en="Prototype Not Found" data-de="Prototyp nicht gefunden">Prototyp nicht gefunden</h1>
        <p data-en="The requested page or component seems to have drifted into the void. Let's get you back on track."
           data-de="Dieses Bauteil oder diese Seite existiert noch nicht oder ist in der Werkstatt verloren gegangen.">
          Dieses Bauteil oder diese Seite existiert noch nicht oder ist in der Werkstatt verloren gegangen.
        </p>
      </div>

      <div class="error-cta">
        <a href="index.html" class="btn btn-home" data-en="Back to Studio" data-de="Zurück zum Studio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          <span data-en="Back to Studio" data-de="Zurück zum Studio">Zurück zum Studio</span>
        </a>
      </div>
    </div>
  </div>

  <!-- PLUGINS -->
  <script src="js/custom_cursor.js" defer></script>
  <script src="js/language.js" defer></script>

</body>

</html>
